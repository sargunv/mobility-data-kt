# https://mise.jdx.dev
min_version = "2026.7.15"

[settings]
experimental = true
pin = true
lockfile = true
minimum_release_age = "3d"

[hooks]
postinstall = ["hk install --mise"]

[tools]
"core:java" = "21.0.2"
"aqua:dprint/dprint" = "0.53.2"
"aqua:jdx/hk" = "1.40.0"
"aqua:apple/pkl" = "0.30.2"
"aqua:facebook/ktfmt" = "0.62"
"core:python" = "3.14"
"aqua:git-lfs/git-lfs" = "3.7.1"

# The CLI only; Xcode itself is installed via the xcode:* tasks. macOS-only.
"aqua:XcodesOrg/xcodes" = { version = "1.6.2", os = ["macos"] }

# Fetch the Git-LFS sample datasets used by tests. Runs automatically before
# `mise run`/`mise exec` when the local LFS object cache is missing.
[deps.git-lfs]
auto = true
outputs = [".git/lfs"]
description = "Fetch the Git-LFS sample datasets used by tests"
run = """
git lfs install --local --skip-repo
git lfs pull
"""

[tasks.build]
description = "Build and check all targets"
run = "./gradlew build"

[tasks."test:jvm"]
description = "Run JVM tests"
run = "./gradlew jvmTest"

[tasks."test:jsnode"]
description = "Run JS Node tests"
run = "./gradlew jsNodeTest"

[tasks."test:wasmjsnode"]
description = "Run WASM JS Node tests"
run = "./gradlew wasmJsNodeTest"

[tasks."test:native"]
description = "Run native tests for the current platform"
run = "./gradlew $( uname | grep -q Darwin && echo macosArm64Test || echo linuxX64Test )"

[tasks.test]
description = "Run all tests"
depends = ["test:jvm", "test:jsnode", "test:wasmjsnode", "test:native"]

[tasks.docs]
description = "Serve documentation locally"
run = "./gradlew :mkdocsServe"

[tasks."update:gtfs-realtime:fixtures"]
description = "Refresh checked-in GTFS Realtime protobuf fixtures from public feeds"
run = """
mkdir -p sample-data/gtfs-realtime/sound-transit sample-data/gtfs-realtime/tri-rail

curl -fsSL https://s3.amazonaws.com/st-service-alerts-prod/alerts.pb \
  -o sample-data/gtfs-realtime/sound-transit/alerts.pb

curl -fsSL 'https://gtfsr.tri-rail.com/download.aspx?file=trip_updates.pb' \
  -o sample-data/gtfs-realtime/tri-rail/trip_updates.pb
curl -fsSL 'https://gtfsr.tri-rail.com/download.aspx?file=position_updates.pb' \
  -o sample-data/gtfs-realtime/tri-rail/vehicle_positions.pb
curl -fsSL 'https://gtfsr.tri-rail.com/download.aspx?file=alerts.pb' \
  -o sample-data/gtfs-realtime/tri-rail/alerts.pb
"""

[tasks."xcode:select"]
description = "Install and select the pinned Xcode version on macOS"
run = """
if ! [ "$(uname)" = "Darwin" ]; then
  echo "xcode:select is only supported on macOS" >&2
  exit 1
fi

version="$(tr -d '\n' < .xcode-version)"
if xcodes installed | grep -Fqx "$version"; then
  xcodes select "$version"
else
  echo "Installing Xcode $version via xcodes. Apple ID credentials may be required." >&2
  xcodes install "$version" --select
fi
"""

[tasks."xcode:install-ios-simulator"]
description = "Install the iOS simulator runtime required for Apple-native tests"
run = """
if ! [ "$(uname)" = "Darwin" ]; then
  echo "xcode:install-ios-simulator is only supported on macOS" >&2
  exit 1
fi

xcodebuild -downloadPlatform iOS
"""

[tasks."xcode:install-test-runtimes"]
description = "Install the Apple simulator runtimes required for native test tasks"
run = """
if ! [ "$(uname)" = "Darwin" ]; then
  echo "xcode:install-test-runtimes is only supported on macOS" >&2
  exit 1
fi

xcodebuild -downloadPlatform iOS
xcodebuild -downloadPlatform tvOS
xcodebuild -downloadPlatform watchOS
"""

[tasks.check]
description = "Run all linting and formatting checks"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix formatting issues"
run = "hk fix --all"

[tasks._ktfmt]
description = "Called by dprint.json"
hide = true
run = 'java -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'
